<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONSTER LEGACY Audio Lab</title><style>body{margin:0;background:#080b10;color:#eee;font-family:system-ui;padding:18px;max-width:520px;margin:auto}h1{font-family:Georgia,serif;color:#e3c78c}.card{border:1px solid #414a55;background:#11161d;border-radius:12px;padding:14px;margin:12px 0}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button{min-height:48px;border:1px solid #765d35;background:#241c12;color:#f4e5c5;border-radius:9px;font-weight:700}.se{border-color:#42556d;background:#101924}.meter{font-size:34px;font-family:Georgia,serif;color:#ff7761}small{color:#9eabb7}</style></head><body><h1>MONSTER LEGACY</h1><p>Production Audio Integration Lab v0.6.6</p><div class="card"><button id="toggle">♫ AUDIO OFF</button><div id="mode"><small>Tap AUDIO to unlock mobile audio.</small></div></div><div class="card"><div class="meter" id="v">0 CALM</div><div class="row"><button data-v="0">CALM 0</button><button data-v="30">HEAT 30</button><button data-v="60">RAGE 60</button><button data-v="90">DANGER 90</button><button data-v="100">LEGACY 100</button></div></div><div class="card"><div class="row" id="se"></div></div><script src="src/audio.js"></script><script>const q=s=>document.querySelector(s);q('#toggle').onclick=async()=>{const on=await MLAudio.toggle();q('#toggle').textContent=on?'♫ AUDIO ON':'♫ AUDIO OFF';q('#mode').textContent=JSON.stringify(MLAudio.status())};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const v=+b.dataset.v;await MLAudio.setVoltage(v,true);q('#v').textContent=v+' '+MLAudio.band(v);q('#mode').textContent=JSON.stringify(MLAudio.status())});['select','command','stance','execute','hit','crash','equipment','join','band','legacy'].forEach(n=>{const b=document.createElement('button');b.className='se';b.textContent=n.toUpperCase();b.onclick=()=>MLAudio.event(n);q('#se').appendChild(b)});</script></body></html>
