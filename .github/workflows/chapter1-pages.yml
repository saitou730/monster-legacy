name: Chapter 1 Pages Preview

on:
  push:
    branches:
      - feature/ch1-vertical-slice-v0.5
    paths:
      - 'prototype/chapter1/**'
      - '.github/workflows/chapter1-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Chapter 1 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/chapter1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
