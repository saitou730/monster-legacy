name: Build Sekasuku Voice Reader APK

on:
  push:
    branches:
      - sekasuku-voice-reader-build
    paths:
      - 'build_payload/**'
      - '.github/workflows/sekasuku-voice-reader-build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct Android project
        run: |
          mkdir -p /tmp/sekasuku
          cat build_payload/part{00..11}.txt | base64 --decode > /tmp/sekasuku-source.zip
          unzip -q /tmp/sekasuku-source.zip -d /tmp/sekasuku
          test -f /tmp/sekasuku/settings.gradle
          test -f /tmp/sekasuku/app/build.gradle

      - name: Build debug APK
        run: gradle -p /tmp/sekasuku --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s /tmp/sekasuku/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/sekasuku/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sekasuku-voice-reader-apk
          path: /tmp/sekasuku/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
