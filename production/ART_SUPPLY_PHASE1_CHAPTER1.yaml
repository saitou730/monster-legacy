schema_version: 1
updated: 2026-09-11
policy:
  gameplay_loop: AREA -> DISCOVERY -> HUNT_JOIN -> PARTY -> FUSION -> AREA_BOSS -> LEGACY -> NEXT_AREA
  priority: [CHAPTER_1, AREA, LINEAGE_FUSION, OFFLINE_ARENA, ANOMALY, SANCTUARY]
  portrait_first: true
  aspect_ratio: "9:16"
  production_gate: "Ship at production-ready quality; fix minor issues in runtime QA instead of repeatedly regenerating near-identical art."
  character_policy: "Never reinterpret existing Official Art Lock species."
existing_character_art:
  status: OFFICIAL_ART_LOCK_INHERITED
  authority: canon/visual_source_map.yaml
  species: [SP-001, SP-011, SP-018, SP-031, SP-044, SP-071, SP-191]
chapter1_supply:
  - id: CH1_ENV_001
    asset: thorn_boundary_field
    screens: [FIELD, HUNT, BOSS_REPLAY]
    status: PRODUCTION_PASS_WITH_FIX
    planned_path: assets/backgrounds/chapter1/thorn_boundary_field.jpg
    direction: "desaturated thorn wilderness; open encounter lane; lower UI-safe zone; no faction symbols"
    runtime_fix: "crop/grade to suppress distant ruin dominance; HUNT distinction via runtime wind/dust/vignette FX"
    work_dependency: "Work integrates one shared base background; do not wait for another near-identical raster regeneration"
  - id: CH1_ENV_002
    asset: home
    screens: [HOME, PARTY]
    status: VISUAL_LOCKED_AWAITING_REPOSITORY_RASTER
    planned_path: assets/backgrounds/chapter1/home.jpg
    handoff: production/art_handoffs/CH1_ENV_002_HOME.yaml
    reuse_rule: "PARTY uses HOME base with UI treatment"
    promotion_gate: "No more near-identical regeneration. Export approved portrait candidate once, run 360x800 / 390x844 / 430x932 overlay QA, compute final SHA-256, then hand to Work."
  - id: CH1_ENV_003
    asset: fusion_lab
    screens: [FUSION, HERITAGE]
    status: DIRECTION_SPECIFIED_HOLD_GENERATION
    planned_path: assets/backgrounds/chapter1/fusion_lab.jpg
    handoff: production/art_handoffs/CH1_ENV_003_FUSION_LAB.yaml
  - id: CH1_FX_001
    asset: join_fx
    screens: [JOIN]
    status: SPEC_READY_FOR_WORK_BINARY
    planned_path: assets/effects/join/
    handoff: production/art_handoffs/CH1_FX_001_JOIN.yaml
    work_packet: production/art_handoffs/CH1_FX_MODULAR_WORK_PACKET.yaml
    modular: true
    production_gate: "Produce character-neutral transparent resonance overlay only; preserve SP-031 locked art; record viewport/reduced-motion QA and final SHA-256 before Official Art Lock."
  - id: CH1_FX_002
    asset: fusion_fx
    screens: [FUSION]
    status: SPEC_READY_FOR_WORK_BINARY
    planned_path: assets/effects/fusion/
    handoff: production/art_handoffs/CH1_FX_002_FUSION.yaml
    work_packet: production/art_handoffs/CH1_FX_MODULAR_WORK_PACKET.yaml
    modular: true
    production_gate: "Produce character-neutral transparent convergence/reveal overlay only; preserve SP-011/SP-031/SP-044 locked art; never create intermediate hybrid anatomy; record viewport/reduced-motion QA and final SHA-256 before Official Art Lock."
  - id: CH1_FX_003
    asset: contract_summon_fx
    screens: [CONTRACT_SUMMON]
    status: SPEC_READY_FOR_WORK_BINARY
    planned_path: assets/effects/contract/
    handoff: production/art_handoffs/CH1_FX_003_CONTRACT_SUMMON.yaml
    work_packet: production/art_handoffs/CH1_FX_MODULAR_WORK_PACKET.yaml
    modular: true
    production_gate: "Produce character-neutral transparent signal/convergence overlay only; runtime owns guaranteed Lyra result and later support-equip state; never infer Lyra design; record viewport/reduced-motion QA and final SHA-256 before Official Art Lock."
  - id: CH1_FX_004
    asset: legacy_fx
    screens: [LEGACY]
    status: SPEC_READY_FOR_WORK_BINARY
    planned_path: assets/effects/legacy/
    handoff: production/art_handoffs/CH1_FX_004_LEGACY.yaml
    work_packet: production/art_handoffs/CH1_FX_MODULAR_WORK_PACKET.yaml
    modular: true
    production_gate: "Produce symbol-neutral transparent mastery/confirmation overlay only; preserve SP-191 locked art; runtime owns 不退転 grant/rank/archive state; record viewport/reduced-motion QA and final SHA-256 before Official Art Lock."
area02_supply:
  - id: AREA02_RUNTIME_001
    asset: existing_locked_species_runtime_inventory
    status: PASS_WITH_HOLD
    handoff: production/art_handoffs/AREA02_EXISTING_LOCKED_SPECIES_RUNTIME_INVENTORY.yaml
    pass: "SP-044 雷フクロウ has canonical source plus idle/attack/hit/danger/stance/icon and attack_prep derivatives; no same-purpose regeneration."
    hold: "裂空マンティコア is user-declared Official Art Lock but canonical repository source/runtime binding was not found in current visual_source_map search; do not infer or generate."
  - id: AREA02_RUNTIME_002
    asset: SP044_governed_runtime_motion
    status: SPEC_READY_FOR_WORK
    handoff: production/art_handoffs/AREA02_SP044_RUNTIME_MOTION_SPEC.yaml
    source_policy: "Existing verified SP-044 rasters only; no new character art or synthesized in-between anatomy."
    timing: "idle 900ms loop; attack 180/140/220ms; hit 160/240ms; danger 700ms loop; stance 220/260ms; anchor monster_stage_center."
    work_dependency: "PR #74 AREA owl runtime binding; Work owns event synchronization, accessibility preference detection, UI, QA and publication."
notes:
  - "TITLE/PROLOGUE should reuse an AREA/environment plate plus typography/grade unless runtime proves a dedicated raster necessary."
  - "BOSS replay reuses FIELD base with encounter grade/FX; no dedicated background until runtime QA demonstrates need."
  - "OFFICIAL ART LOCK requires final repository file, SHA-256, source comparison QA, and documented visual constraints."
  - "Issue #78 and CH1_FX_MODULAR_WORK_PACKET.yaml consolidate the four governed FX into one Work implementation packet; do not regenerate character art."
