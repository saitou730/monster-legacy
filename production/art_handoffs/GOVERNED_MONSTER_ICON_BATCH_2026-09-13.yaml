rules:
  - "Never redraw, recolor, morph, synthesize anatomy, change eyes/body proportions, or alter silhouette."
  - "Use only a visual_source_map-governed existing raster/source for each species."
  - "Export is a deterministic crop/fit operation only; source pixels may be resampled for delivery size but not repainted."
  - "Transparent padding is allowed; generative fill/background replacement is forbidden."
  - "Do not overwrite any existing assets/art/* or assets/battle/* file. New icon files require Work-side hash verification before binding."
  - "SP-044 and SP-192 are excluded from export: canonical icon_portrait.png derivatives already exist and must be reused."
preflight:
  checked_on_main: 54aa8c248373a2fd26855d31e6efb615c0086467
  output_directory_search: "No existing assets/icons/monsters entries were found on canonical main during Art Director preflight."
  spot_check: "assets/icons/monsters/sp001_goura.png returned Not Found on canonical main."
  collision_policy: "Immediately before export, Work must re-check each planned_path on latest main. If a planned_path now exists, HOLD_COLLISION and compare its provenance/SHA; never overwrite or create a suffixed duplicate automatically."
  stale_main_policy: "If main advances before export, re-read visual_source_map and this handoff. A source SHA/path change requires HOLD_SOURCE_MISMATCH until Art Director reconciliation; do not export from the stale source."
delivery:
  format: PNG
  canvas: "256x256"
  alpha: true
  anchor: icon_center
  fit: "contain full identity-defining head/face and enough upper silhouette to remain recognizable; never crop eyes, ears/horns/wings that define identity"
  safe_margin: "minimum 8% canvas on the tightest identity-defining edge where source permits"
  background: transparent
  runtime_scale_policy: "downscale from 256; do not upscale a smaller source beyond native clarity if it causes destructive blur"
  qa_view_sizes: [64, 96, 128, 256]
  qa_checks:
    - "recognizable at 64px"
    - "eyes and primary silhouette remain readable"
    - "no source-external pixels except transparent padding"
    - "no clipping of identity-defining anatomy"
    - "source SHA-256 verified before export"
    - "output SHA-256 recorded before runtime binding"
acceptance_record_required:
  per_export:
    - species_id
    - source_path
    - expected_source_sha256
    - verified_source_sha256
    - output_path
    - output_sha256
    - crop_box_or_contain_transform
    - transparent_padding_px
    - readability_64
    - readability_96
    - readability_128
    - readability_256
    - art_lock_identity_check
    - collision_preflight
  pass_rule: "PASS only when expected_source_sha256 equals verified_source_sha256, planned output path is collision-free on latest main, output is 256x256 RGBA/transparent, no source-external opaque pixels are introduced, identity-defining anatomy is not clipped, all four readability checks pass, and output_sha256 is recorded before binding."
  hold_rule: "HOLD_SOURCE_MISMATCH if source SHA differs from canon; HOLD_COLLISION if planned output path already exists without reconciled provenance; HOLD_CROP if identity anatomy cannot fit safely; HOLD_READABILITY if 64px identity fails. Do not regenerate or repaint to escape HOLD."
  reject_rule: "REJECT if redraw/recolor/generative fill/anatomy synthesis or overwrite of governed battle/art assets occurred."
