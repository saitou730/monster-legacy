shared_constraints:
  - "Character-neutral transparent FX only."
  - "Do not redraw, morph, recolor, reinterpret, or bake anatomy from any Official Art Lock species into FX."
  - "Do not infer missing named-character identity from generic species art."
  - "No readable text or UI controls baked into FX."
  - "No persistent loop after completion state."
  - "Do not overwrite assets/art/* or assets/battle/*."
  - "Do not modify root game code or publication workflow from Art supply."
work_integration:
  owner: Work
  responsibilities:
    - create/export runtime binaries from the locked motion directions
    - bind FX to existing runtime events without changing game-result ownership
    - preserve UI and character silhouette readability
    - detect reduced-motion preference and select the defined alternative
    - run viewport and runtime QA before publication
  viewport_qa: [360x800, 390x844, 430x932]
  source_preservation_qa: "Verify governing Official Art Lock character bytes remain unchanged."
  flash_safety: "No repeated high-intensity flash; reduced-motion alternatives are non-looping."
canon_reconciliation:
  current_manifest: production/ART_SUPPLY_PHASE1_CHAPTER1.yaml
  sp192_status: "canonical binding recovered; runtime motion QA PASS; obsolete recovery HOLD removed"
  owl_manticore_manifest: "assets/battle/manifest.json now exposes governed owl and manticore runtime directories on main"
art_director_qa:
  verdict: PASS_SPEC_READY_FOR_WORK
  rationale: "All four FX have runtime-governed semantics and locked frame timing. Current canon has no SP-192 recovery blocker; Work should spend the next implementation lane on visible binaries/runtime binding rather than repeat source recovery."
  official_art_lock: NOT_DECLARED
  official_lock_gate:
    - final repository binary filenames and paths recorded
    - SHA-256 recorded for every final binary
    - required viewport QA passed
    - reduced-motion QA passed
    - source-preservation QA passed
