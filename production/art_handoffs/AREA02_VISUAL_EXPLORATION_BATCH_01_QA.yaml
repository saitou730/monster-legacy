    locked_from_exploration:
      - low horizontal mammal body
      - long spring legs / rapid dash posture
      - ochre + charcoal natural-material palette family
    next_revision:
      - reduce external lightning by at least 80 percent
      - make one forked tail conductor the dominant identifier
      - shrink eyes and lengthen narrow chest/muzzle read
      - avoid zigzag ear/tail language and mascot cheek-lightning motifs
  A02-STONEPLANT-B:
    working_name: アースモス
    result: HOLD_REVISE
    strengths:
      - wide grounded footprint clearly differentiates from Leaf Rabbit
      - porous stone + living plant boundary reads well at thumbnail size
      - muted stone/olive family is suitable for plateau ecology
    defects:
      - current body is too turtle/golem-like and too bilaterally symmetrical
      - glowing amber fissures are too strong; direction required matte non-luminous material
      - face is too expressive/anthropomorphic
      - plant crown is too decorative and centered; required asymmetric limited plant mass from one side
    locked_from_exploration:
      - footprint wider than height
      - porous warm-gray stone + muted olive material pairing
      - visibly integrated root/stone boundary
    next_revision:
      - shift plant mass strongly to one side and expose sloped root ridge across body
      - remove shell/turtle anatomy cues and bilateral limb symmetry
      - remove luminous cracks; use desaturated copper/amber root-vein marks only
      - recess eyes further and remove readable mouth expression
