schema_version: 1
status: DESIGN_WORKING_CANON
scope: monster_design_expansion
updated: 2026-09-07

principles:
  - "SP-001..SP-200 core roster remains preserved; expansion species may exist outside the 200 cap."
  - "MONSTER LEGACY has no evolution system. A small species never transforms into a larger species by default."
  - "Early-game lovable species, mid-game tactical species, and late-game powerful species are separate species and separate encounters."
  - "Design target is monster-first with attachment value: lovable does not mean toy-like, and endgame strength does not require grim/edgy styling."
  - "Avoid repeated regeneration of an already-approved concept unless QA identifies a concrete defect."
  - "Do not reinterpret existing OFFICIAL ART LOCK / VISUAL DESIGN LOCK monsters."

lock_policy:
  official_art_lock_requires: "exact repository asset path + SHA-256 + source comparison QA"
  visual_direction_lock: "concept/design direction is frozen; source binding is still required before OFFICIAL ART LOCK"
  candidate: "usable design candidate; may be accepted, revised, or rejected after comparison QA"

