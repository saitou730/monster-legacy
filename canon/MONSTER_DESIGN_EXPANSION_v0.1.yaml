rejected_or_noncanonical_presentations:
  - "Evolution-line presentation or wording"
  - "Any implication that BUDDY -> TACTICAL -> ELITE are transformation stages of one species"
  - "All-new monsters rendered uniformly super-cute / toy-like"
  - "Late-game monsters required to become uniformly aggressive, armored, or edgy"
  - "Repeated redraws of the same approved four monsters without a specific QA reason"

