rejected_or_noncanonical_presentations:
  - "Evolution-line presentation or wording"
  - "Any implication that BUDDY -> TACTICAL -> ELITE are transformation stages of one species"
  - "All-new monsters rendered uniformly super-cute / toy-like"
  - "Late-game monsters required to become uniformly aggressive, armored, or edgy"
  - "Repeated redraws of approved monsters without a specific QA reason"
  - "Large round sparkling eyes used as a default solution for attachment"

next_design_queue:
  - id: NEW-SPECIES-BATCH-05
    goal: "Continue new-species expansion with broader body plans and endgame attachment value"
    target_count: 8
    desired_gaps:
      - "mollusk / soft-body"
      - "amphibian without mascot eyes"
      - "small swarm / collective organism"
      - "wind species that is not a bird"
      - "fire species that is not flame-armored"
      - "crystal / refractive organism"
      - "late-game gentle powerhouse with a non-canine/deer body plan"
      - "elite aquatic or aerial silhouette unlike existing dragons"
    rule: "All eight must be new species. No evolution. No re-generation of previously locked species. Apply locked eye-language direction."

source_binding_note: "Generated concept images currently exist in conversation context but are not yet authoritative repository assets. VISUAL_DIRECTION_LOCK freezes concept direction only. Do not promote any entry to OFFICIAL ART LOCK until exact source image path and SHA-256 are bound in GitHub."
